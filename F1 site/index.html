<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corrida 16-Bit - Interlagos</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Semáforo de Largada F1 -->
    <div id="start-lights" class="hidden">
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
    </div>

    <!-- HUD Superior: Posição, Voltas, Tempos e Pneus -->
    <div id="top-hud">
      <div class="hud-box compact">
        <span class="label">POS</span>
        <span id="pos-display" class="value-sm">8 / 8</span>
      </div>

      <div class="hud-box compact">
        <span class="label">LAP</span>
        <span id="lap-display" class="value-sm">1 / 3</span>
      </div>

      <div class="hud-box compact">
        <span class="label">TIME</span>
        <span id="time-display" class="value-sm">00:00.00</span>
      </div>

      <div class="hud-box compact">
        <span class="label">BEST</span>
        <span id="best-display" class="value-sm">--:--.--</span>
      </div>

      <div class="hud-box compact">
        <span class="label">TIRES</span>
        <div class="tire-bar-bg">
          <div id="tire-fill"></div>
        </div>
      </div>
    </div>

    <!-- Aviso central de Largada / Pit Limiter -->
    <div id="pit-banner" class="hidden">PIT LIMITER 80 KM/H</div>

    <!-- HUD Inferior: Marcha, RPM e Velocímetro -->
    <div id="hud">
      <div class="hud-box">
        <span class="label">GEAR</span>
        <span id="gear-display" class="value">1</span>
      </div>

      <div class="hud-box rpm-box">
        <span class="label">RPM</span>
        <div class="rpm-bar-bg">
          <div id="rpm-fill"></div>
        </div>
      </div>

      <div class="hud-box">
        <span id="speed-display" class="value">000</span>
        <span class="label">KM/H</span>
      </div>
    </div>

    <!-- Tela de Fim de Corrida -->
    <div id="finish-screen" class="hidden">
      <div class="finish-card">
        <h2>BANDEIRADA FINAL!</h2>
        <p class="subtitle">AUTÓDROMO DE INTERLAGOS - 3 VOLTAS</p>
        <div class="stats">
          <div>POSIÇÃO FINAL: <span id="final-pos">1º LUGAR</span></div>
          <div>TEMPO TOTAL: <span id="final-total-time">00:00.00</span></div>
          <div>MELHOR VOLTA: <span id="final-best-time">00:00.00</span></div>
        </div>
        <button id="restart-btn">CORRER NOVAMENTE</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
